name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Step 1: Ensure KV namespace exists, get its ID ──────────────────
      - name: Setup Cloudflare KV namespace
        id: kv_setup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # List existing KV namespaces
          EXISTING=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=100" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json")

          # Check if finding-peace-kv already exists
          KV_ID=$(echo "$EXISTING" | node -e "
            let d=''; process.stdin.on('data',c=>d+=c).on('end',()=>{
              try {
                const r=JSON.parse(d);
                const ns=(r.result||[]).find(n=>n.title==='finding-peace-kv');
                if(ns){process.stdout.write(ns.id)}else{process.stdout.write('')}
              } catch(e){process.stdout.write('')}
            })" 2>/dev/null || echo "")

          if [ -z "$KV_ID" ]; then
            echo "Creating KV namespace finding-peace-kv..."
            CREATE=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"title":"finding-peace-kv"}')
            KV_ID=$(echo "$CREATE" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const r=JSON.parse(d);process.stdout.write(r.result?.id||'')}catch(e){process.stdout.write('')}})" 2>/dev/null || echo "")
            echo "Created KV namespace: $KV_ID"
          else
            echo "Found existing KV namespace: $KV_ID"
          fi

          # Check if preview KV namespace exists
          KV_PREVIEW_ID=$(echo "$EXISTING" | node -e "
            let d=''; process.stdin.on('data',c=>d+=c).on('end',()=>{
              try {
                const r=JSON.parse(d);
                const ns=(r.result||[]).find(n=>n.title==='finding-peace-kv-preview');
                if(ns){process.stdout.write(ns.id)}else{process.stdout.write('')}
              } catch(e){process.stdout.write('')}
            })" 2>/dev/null || echo "")

          if [ -z "$KV_PREVIEW_ID" ]; then
            CREATE2=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"title":"finding-peace-kv-preview"}')
            KV_PREVIEW_ID=$(echo "$CREATE2" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const r=JSON.parse(d);process.stdout.write(r.result?.id||'')}catch(e){process.stdout.write('')}})" 2>/dev/null || echo "")
          fi

          echo "kv_id=$KV_ID" >> $GITHUB_OUTPUT
          echo "kv_preview_id=$KV_PREVIEW_ID" >> $GITHUB_OUTPUT

      # ── Step 2: Inject real KV IDs into wrangler.jsonc ──────────────────
      - name: Patch wrangler.jsonc with real KV IDs
        env:
          KV_ID: ${{ steps.kv_setup.outputs.kv_id }}
          KV_PREVIEW_ID: ${{ steps.kv_setup.outputs.kv_preview_id }}
        run: |
          node -e "
            const fs=require('fs');
            let cfg=fs.readFileSync('wrangler.jsonc','utf8');
            cfg=cfg.replace('PLACEHOLDER_KV_ID', process.env.KV_ID || 'local');
            cfg=cfg.replace('PLACEHOLDER_KV_PREVIEW_ID', process.env.KV_PREVIEW_ID || 'local');
            fs.writeFileSync('wrangler.jsonc', cfg);
            console.log('wrangler.jsonc patched with KV IDs');
          "

      # ── Step 3: Build ────────────────────────────────────────────────────
      - name: Build
        run: npm run build

      # ── Step 4: Deploy to Cloudflare Pages ──────────────────────────────
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: finding-peace
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main

      # ── Step 5: Bind KV to Pages project ────────────────────────────────
      - name: Bind KV namespace to Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_ID: ${{ steps.kv_setup.outputs.kv_id }}
          KV_PREVIEW_ID: ${{ steps.kv_setup.outputs.kv_preview_id }}
        run: |
          if [ -z "$KV_ID" ]; then
            echo "No KV ID, skipping binding"
            exit 0
          fi

          curl -s -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/finding-peace" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"deployment_configs\": {
                \"production\": {
                  \"kv_namespaces\": {
                    \"FP_KV\": { \"namespace_id\": \"$KV_ID\" }
                  }
                },
                \"preview\": {
                  \"kv_namespaces\": {
                    \"FP_KV\": { \"namespace_id\": \"${KV_PREVIEW_ID:-$KV_ID}\" }
                  }
                }
              }
            }" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const r=JSON.parse(d);console.log('KV bind result:',r.success?'SUCCESS':'FAILED',JSON.stringify(r.errors||[]))}catch(e){console.log('parse error',e.message)}})"
